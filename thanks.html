<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дякуємо! | Ілона Солдатюк</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#FFF8F0',
                        gold: {
                            DEFAULT: '#C4956A',
                            dark: '#A67B52',
                        },
                        blush: '#E8C4B8',
                        charcoal: {
                            DEFAULT: '#2D2926',
                            light: '#4A4543'
                        }
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['"Inter"', 'sans-serif'],
                    },
                    backgroundImage: {
                        'gold-gradient': 'linear-gradient(135deg, #C4956A 0%, #A67B52 100%)',
                        'soft-glow': 'radial-gradient(circle at center, rgba(196,149,106,0.1) 0%, transparent 70%)'
                    },
                    boxShadow: {
                        'gold': '0 20px 50px -15px rgba(196, 149, 106, 0.6)',
                        'gold-hover': '0 25px 50px -12px rgba(196, 149, 106, 0.8)',
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #FFF8F0; color: #2D2926; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
        h1, h2, .font-serif { font-family: 'Playfair Display', serif; text-transform: uppercase; letter-spacing: -0.01em; }
        
        .premium-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(196, 149, 106, 0.15);
            border-radius: 32px;
        }

        .btn-premium {
            background: linear-gradient(135deg, #C4956A 0%, #A67B52 100%);
            border-radius: 9999px;
            box-shadow: 0 20px 50px -15px rgba(196, 149, 106, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            color: white;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }
        .btn-premium:hover {
            box-shadow: 0 25px 50px -12px rgba(196, 149, 106, 0.8);
            transform: translateY(-2px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

    <!-- Meta Pixel Code -->
    <script>
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        
        fbq('init', '1299600201739170');
        fbq('track', 'PageView');
        
        const price = localStorage.getItem('purchase_price') || '390';
        
        fbq('track', 'Purchase', {
            value: parseFloat(price),
            currency: 'UAH',
            content_name: 'Індивідуальна сесія'
        });
    </script>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1299600201739170&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel Code -->
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative selection:bg-gold selection:text-white">
    
    <div class="absolute inset-0 bg-soft-glow opacity-60"></div>

    <div class="text-center max-w-lg mx-auto relative z-10 w-full animate-[fadeIn_1s_ease-out]">
        
        <!-- Іконка успіху -->
        <div class="w-24 h-24 bg-gold/10 rounded-full flex items-center justify-center mx-auto mb-8 relative">
            <div class="absolute inset-0 bg-gold/20 blur-xl rounded-full"></div>
            <i data-lucide="check" class="w-10 h-10 text-gold-dark relative z-10"></i>
        </div>
        
        <h1 class="text-3xl md:text-4xl font-serif text-charcoal mb-4">Дякуємо за довіру</h1>
        
        <div class="premium-card p-8 mb-8">
            <p class="text-charcoal-light leading-relaxed font-light text-lg">
                Ваша заявка успішно прийнята.<br>
                Найближчим часом ми зв'яжемося з вами для узгодження часу сесії.
            </p>
        </div>
        
        <p class="text-charcoal-light/70 mb-8 text-sm max-w-sm mx-auto">
            А поки приєднуйтесь до каналу — там багато корисного про стосунки та жіночність.
        </p>
        
        <a href="https://t.me/+QRvgiafVoZdkZjcy" class="btn-premium px-10 py-5 w-full md:w-auto text-sm font-semibold group relative overflow-hidden">
            <span class="relative z-10 flex items-center gap-3">
                <i data-lucide="send" class="w-4 h-4"></i>
                Перейти в Telegram
            </span>
            <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-500 ease-out"></div>
        </a>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
